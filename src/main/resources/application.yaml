spring:
  application:
    name: kbuddy

  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/kbuddy
    username: root

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

jwt:
  issuer: kbuddy
  signup-token-expiration: 10m
  access-token-expiration: 1h