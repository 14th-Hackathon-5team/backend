spring:
  application:
    name: kbuddy

  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/kbuddy
    username: root

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

  security:
    oauth2:
      client:
        registration:
          google:
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile
              - email
            client-name: Google
          kakao:
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  issuer: kbuddy
  signup-token-expiration: 10m
  access-token-expiration: 1h

app:
  oauth2:
    redirect-uri: http://localhost:3000/oauth/callback
  cors:
    allowed-origin: https://frontend-chi-pied-78.vercel.app

ai:
  fastapi:
    base-url: ${AI_FASTAPI_BASE_URL:http://localhost:8000}
    internal-api-key: ${AI_INTERNAL_API_KEY:}
    recommendation-timeout: 10s
    chat-timeout: 20s
    news-timeout: 150s

scheduler:
  notification:
    cron: "0 0 9 * * *"

seoul:
  job:
    base-url: ${SEOUL_JOB_BASE_URL:http://openapi.seoul.go.kr:8088}
    api-key: ${SEOUL_JOB_API_KEY:}
    timeout: 10s